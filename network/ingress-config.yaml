# Standard: PCI DSS v4.0 Req 1.4.2, 4.2.1
# =============================================================================

---
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
spec:
  replicas: 3
  endpointPublishingStrategy:
    type: LoadBalancerService
    loadBalancer:
      scope: External
  defaultCertificate:
    name: enterprise-wildcard-cert
  tlsSecurityProfile:
    type: Custom
    custom:
      ciphers:
        - ECDHE-ECDSA-AES128-GCM-SHA256
        - ECDHE-RSA-AES128-GCM-SHA256
        - ECDHE-ECDSA-AES256-GCM-SHA384
        - ECDHE-RSA-AES256-GCM-SHA384
      minTLSVersion: VersionTLS12
  httpHeaders:
    forwardedHeaderPolicy: Append
    headerNameCaseAdjustments: []
  httpCompression:
    mimeTypes:
      - "text/html"
      - "application/json"
  tuningOptions:
    headerBufferBytes: 32768
    headerBufferMaxRewriteBytes: 8192
    threadCount: 4
    clientTimeout: 30s
    serverTimeout: 30s
    tunnelTimeout: 1h
  logging:
    access:
      destination:
        type: Container
      httpLogFormat: '%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r'
  httpErrorCodePages:
    name: custom-error-pages
  nodePlacement:
    nodeSelector:
      matchLabels:
        node-role.kubernetes.io/infra: ""
    tolerations:
      - key: node-role.kubernetes.io/infra
        operator: Exists
        effect: NoSchedule

---
# Security response headers via Route annotations
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: secure-app-route
  namespace: app-production
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000;includeSubDomains;preload"
    haproxy.router.openshift.io/timeout: "30s"
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "100"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "50"
    haproxy.router.openshift.io/rate-limit-connections.rate-tcp: "100"
spec:
  host: app.enterprise.example.com
  to:
    kind: Service
    name: app-service
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
    certificate: |
      -----BEGIN CERTIFICATE-----
      <CERTIFICATE>
      -----END CERTIFICATE-----
    key: |
      -----BEGIN RSA PRIVATE KEY-----
      <PRIVATE_KEY>
      -----END RSA PRIVATE KEY-----
    destinationCACertificate: |
      -----BEGIN CERTIFICATE-----
      <DESTINATION_CA>
      -----END CERTIFICATE-----

---
# cert-manager ClusterIssuer for automated certificate management
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@enterprise.example.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: openshift-default
