# =============================================================================
# Service Account Management
# Author: Ali AlEnezi (@SiteQ8)
# Standard: PCI DSS v4.0 Req 8.6.1
# =============================================================================

---
# Dedicated service account for payment processing
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: pci-cde
  labels:
    pci-dss/cde-access: "true"
  annotations:
    kubernetes.io/enforce-mountable-secrets: "true"
    description: "Service account for payment processing pods"
automountServiceAccountToken: false

---
# Dedicated service account for application workloads
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-workload
  namespace: app-production
  annotations:
    kubernetes.io/enforce-mountable-secrets: "true"
automountServiceAccountToken: false

---
# Dedicated service account for CI/CD pipeline
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-pipeline
  namespace: ci-cd
  annotations:
    kubernetes.io/enforce-mountable-secrets: "true"
automountServiceAccountToken: true
secrets:
  - name: tekton-pipeline-registry-creds
  - name: tekton-pipeline-git-creds
