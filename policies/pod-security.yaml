# =============================================================================
# Pod Security Standards - Restricted Profile
# Author: Ali AlEnezi (@SiteQ8)
# =============================================================================

---
# Namespace label for Pod Security Standards enforcement
apiVersion: v1
kind: Namespace
metadata:
  name: app-production
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    security.openshift.io/classification: "confidential"
    pci-dss/zone: "application"

---
apiVersion: v1
kind: Namespace
metadata:
  name: pci-cde
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    security.openshift.io/classification: "restricted"
    pci-dss/zone: "cde"
  annotations:
    network-policy/configured: "true"
    openshift.io/node-selector: "node-role.kubernetes.io/pci-cde=true"

---
# LimitRange for PCI CDE namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: pci-cde-limits
  namespace: pci-cde
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
    - type: Pod
      max:
        cpu: "4"
        memory: "8Gi"

---
# ResourceQuota for PCI CDE namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pci-cde-quota
  namespace: pci-cde
spec:
  hard:
    pods: "20"
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    persistentvolumeclaims: "10"
    services.loadbalancers: "0"
    services.nodeports: "0"
