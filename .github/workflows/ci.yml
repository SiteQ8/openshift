name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: find . -name '*.yaml' -o -name '*.yml' | xargs yamllint -d relaxed || true
      - name: Validate HTML
        run: |
          python3 -c "
          from html.parser import HTMLParser
          p = HTMLParser()
          with open('gui/index.html') as f: p.feed(f.read())
          print('HTML: valid')
          "
